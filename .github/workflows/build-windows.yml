name: Build Windows .exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Install runtime dependencies
        run: |
          pip install numpy Pillow opencv-python
          pip install dlib
          pip install git+https://github.com/ageitgey/face_recognition_models
          pip install face_recognition

      - name: Install PyInstaller
        run: |
          pip install pyinstaller
          pip install --upgrade --force-reinstall setuptools

      - name: Convert icon.png to icon.ico
        run: |
          python -c "from PIL import Image; Image.open('assets/icon.png').save('assets/icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build .exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name VideoFaceScanner
          --icon assets/icon.ico
          --add-data "assets;assets"
          --collect-data face_recognition_models
          --copy-metadata face_recognition_models
          --hidden-import pkg_resources
          --hidden-import pkg_resources.py2_warn
          main.py

      - name: Show build output
        run: dir dist

      - name: Upload artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: VideoFaceScanner-Windows
          path: dist/VideoFaceScanner.exe

      - name: Attach to release (tag runs only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoFaceScanner.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
